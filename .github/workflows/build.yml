name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # ভার্সন নাম হবে <MAJOR_VERSION>.<রান নম্বর>, যেমন 1.1, 1.2, 1.3...
  # ভার্সন কোড = রান নম্বর (প্রথম রানে 1)
  MAJOR_VERSION: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # কীস্টোর সেটআপ:
      # Secrets দেওয়া থাকলে সেটাই ব্যবহার হবে (আপডেটের জন্য এটাই সঠিক পথ)।
      # না থাকলে অস্থায়ী কীস্টোর বানিয়ে সাইন করা হবে (এই APK-র উপর পরে আপডেট ইনস্টল হবে না)।
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret পাওয়া যায়নি। অস্থায়ী কীস্টোর দিয়ে সাইন করা হচ্ছে। README দেখে স্থায়ী কীস্টোর সেট করুন।"
            keytool -genkeypair -v -keystore "$KS" -alias hisab -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass hisabtemp123 -keypass hisabtemp123 \
              -dname "CN=Hisab, OU=Dev, O=Hisab, C=BD"
            echo "KEYSTORE_PASSWORD=hisabtemp123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=hisab" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=hisabtemp123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=${{ env.MAJOR_VERSION }}.${{ github.run_number }}

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "hisab-v${{ env.MAJOR_VERSION }}.${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisab-v${{ env.MAJOR_VERSION }}.${{ github.run_number }}
          path: hisab-v*.apk
          if-no-files-found: error
